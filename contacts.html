<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechGear Store | Contact Us</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">TechGear Store</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow-1 container my-5">
    
    <!-- Page Header -->
    <div class="text-center mb-5 animate__animated animate__fadeInDown">
      <h1 class="fw-bold display-5">Get in Touch</h1>
      <p class="text-muted">Have a question about our products or need support?</p>
    </div>

    <div class="row justify-content-center animate__animated animate__fadeIn">
      <div class="col-lg-8">
        
        <!-- Required Bootstrap Alert Component -->
        <div class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
          <strong>Note:</strong> we'd love to get in touch, send us a messege and we'll reply as fast as we can
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Contact Form Card -->
        <div class="card border-0 shadow-sm p-4">
          <div class="card-body">
            <form>
              <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="fullName" placeholder="Enter your name">
              </div>

              <div class="mb-3">
                <label for="emailAddress" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="emailAddress" placeholder="name@example.com">
              </div>

              <div class="mb-3">
                <label for="subject" class="form-label fw-semibold">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="What is this regarding?">
              </div>

              <div class="mb-4">
                <label for="message" class="form-label fw-semibold">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Type your message here..."></textarea>
              </div>

              <button type="button" class="btn btn-primary w-100 py-2 fw-semibold">Send Message</button>
            </form>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container">
      <p class="mb-1 fw-semibold">TechGear Store</p>
      <p class="mb-0 small text-secondary">&copy; 2026 TechGear Store. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
